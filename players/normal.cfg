// ==========================================
// BOT WARFARE - 9v9 GROUND WAR CONFIG
// ==========================================

// 1. ENABLE CUSTOM SKILL MODE
set bots_skill 8

// 2. ENEMY TEAM (Axis: 9 Bots total)
// 2 Hard "try-hards", 7 Medium standard players
set bots_skill_axis_hard 2
set bots_skill_axis_med 7

// 3. YOUR TEAM (Allies: 8 Bots total + You)
// 2 Hard carry, 7 Medium standard players
set bots_skill_allies_hard 2
set bots_skill_allies_med 7

// 4. AUTO-FILL LOBBY (18 total clients: you + 17 bots)
set bots_manage_fill 18

// Count humans and bots together so a human occupies one of the 18 slots.
set bots_manage_fill_mode 0

// Remove an excess bot if another human joins the full lobby.
set bots_manage_fill_kick 1

// Keep both teams balanced, counting humans as well as bots. If you switch
// from one 9-player team to the other, Bot Warfare moves one bot in the
// opposite direction to restore 9v9.
set bots_team autoassign
set bots_team_force 1
set bots_team_mode 0

// Disable IW5's separate automatic team-balance restriction; Bot Warfare's
// bot-aware balancing above handles the final team counts.
set scr_teambalance 0

// In a completely full 9v9 lobby, temporarily remove an enemy bot when a human
// opens the team menu so IW5 has a destination slot available for the switch.
set fun_mode_team_switch_assist 1
set fun_mode_team_switch_fill 18

// 6. BOT SETTINGS
// If the bots should filter bad performing create-a-class selections.
set bots_loadout_reasonable 1

// If the bots should be able to use overpowered and annoying create-a-class selections.
set bots_loadout_allow_op 1

// What rank to set the bots (-1: Average of all players, 0: All random, 1 or higher: Sets rank to this).
set bots_loadout_rank 0

// What prestige to set the bots (-1: Same as host player, -2: All random, 0 or higher: Sets prestige to this).
set bots_loadout_prestige -2

// If the bots can move.
set bots_play_move 1

// If the bots can knife.
set bots_play_knife 1

// If the bots can fire.
set bots_play_fire 1

// If the bots can grenade.
set bots_play_nade 1

// If the bots can take carepackages.
set bots_play_take_carepackages 1

// If the bots can play the objective.
set bots_play_obj 1

// If the bots can camp.
set bots_play_camp 1

// If the bots can jump/drop shot.
set bots_play_jumpdrop 1

// If the bots can target other entities other than players.
set bots_play_target_other 1

// If the bots can call in killstreaks.
set bots_play_killstreak 1

// If the bots can aim down sights.
set bots_play_ads 1

// If the bots can aim.
set bots_play_aim 1

//////////////////////////////////////////////////
// Random Other Settings                        //
//////////////////////////////////////////////////

// Enable YY / double weapon-switch animation cancelling
set sv_enableDoubleTaps 1

//////////////////////////////////////////////////
// IW5 MAP VOTE                                 //
//////////////////////////////////////////////////

set mapvote_enable 1
set mapvote_hide_modes 1

// Randomly select 12 maps from this pool for each vote
set mapvote_maps "Seatown,mp_seatown:Dome,mp_dome:Bakaara,mp_mogadishu:Resistance,mp_paris:Bootleg,mp_bootleg:Hardhat,mp_hardhat:Lockdown,mp_alpha:Village,mp_village:Fallen,mp_lambeth:Mission,mp_bravo:Terminal,mp_terminal_cls:Boardwalk,mp_boardwalk:Off Shore,mp_roughneck:Highrise,mp_highrise:Karachi,mp_checkpoint:Nuketown,mp_nuked:Ambush,mp_convoy:Rust,mp_rust:Rust Long,mp_rust_long:Killhouse,mp_killhouse:Shipment,mp_shipment:Scrapyard,mp_boneyard:Skidrow,mp_nightshift:Sub Base,mp_subbase:Countdown,mp_countdown:Raid,mp_raid:Favela,mp_favela:Trailer Park,mp_trailerpark:Downpour,mp_farm:Vacant,mp_vacant:Wasteland,mp_brecourt:Salvage,mp_compact"

// Your two custom DSR modes
set mapvote_modes "Domination,DOM_HC_HUD:Drop Zone,DZ_HC_HUD"

// Display 12 random maps plus both modes
set mapvote_limits_maps 12
set mapvote_limits_modes 2

// Standard blue appearance
set mapvote_colors_selected "blue"
set mapvote_colors_unselected "white"
set mapvote_colors_timer "blue"
set mapvote_colors_timer_low "red"
set mapvote_colors_help_text "white"
set mapvote_colors_help_accent "blue"
set mapvote_colors_help_accent_mode "standard"

// Sounds and timing
set mapvote_sounds_menu_enabled 1
set mapvote_sounds_timer_enabled 1
set mapvote_vote_time 30

// Visual presentation
set mapvote_blur_level 2.5
set mapvote_blur_fade_in_time 2
set mapvote_horizontal_spacing 100
set mapvote_display_wait_time 1

// Scavenger Changes
set fun_mode_scavenger_enable 1

set fun_mode_scavenger_secondary 1
set fun_mode_scavenger_lethal 1
set fun_mode_scavenger_tactical 1

// Underbarrel grenade launchers
set fun_mode_scavenger_noobtubes 1

// RPG / SMAW / Stinger / Javelin
set fun_mode_scavenger_launchers 1

// cheats enable
set sv_cheats 1
